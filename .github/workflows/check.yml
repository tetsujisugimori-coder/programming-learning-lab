name: Learning site checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run check
      - run: node tools/verify-python.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_EVIDENCE_ROOT: docs/evidence/wasm-focus-20261109/ci
          FOCUS_EVIDENCE_DIR: docs/evidence/wasm-focus-20261109/ci/focus
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: learning-site-evidence
          path: |
            docs/evidence/
            test-results/
